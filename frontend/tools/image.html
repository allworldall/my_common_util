<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线图片压缩改尺寸 - 免费图片处理 | ToolKit</title>
  <meta name="description" content="免费在线图片压缩与改尺寸工具，支持 JPG/PNG/WEBP，本地浏览器处理，图片不上传服务器。" />
  <meta name="keywords" content="图片压缩,在线改尺寸,图片缩小,PNG压缩,JPG压缩,图片处理" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="在线图片压缩改尺寸 - 免费图片处理 | ToolKit" />
  <meta property="og:description" content="免费在线图片压缩与改尺寸工具，支持 JPG/PNG/WEBP，本地浏览器处理，图片不上传服务器。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="canonical" href="__SITE_ORIGIN__/tools/image.html" />
  <meta property="og:url" content="__SITE_ORIGIN__/tools/image.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/assets/og-share.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <main class="page">
    <nav class="top-nav"><a href="../index.html">← 返回工具集</a></nav>
    <header class="header">
      <h1>图片处理</h1>
      <p>本地改尺寸、压大小，图片不会上传到服务器</p>
    </header>

    <section class="card">
      <div class="upload-zone" id="uploadZone">
        <input id="fileInput" type="file" accept="image/*" hidden />
        <p class="upload-title">点击或拖拽图片到此处</p>
        <p class="upload-hint" id="fileHint">支持 JPG / PNG / WEBP</p>
      </div>

      <div class="meta" id="fileMeta" hidden>
        <span id="metaName">-</span>
        <span id="metaOrigin">原图：-</span>
      </div>

      <div class="form-row-3">
        <label class="field">
          <span>目标宽度 (px)</span>
          <input id="width" type="number" min="1" placeholder="如 100" />
        </label>
        <label class="field">
          <span>目标高度 (px)</span>
          <input id="height" type="number" min="1" placeholder="如 100" />
        </label>
        <label class="field">
          <span>锁定比例</span>
          <select id="keepRatio">
            <option value="1" selected>是</option>
            <option value="0">否</option>
          </select>
        </label>
      </div>

      <div class="form-row">
        <label class="field">
          <span>目标大小上限 (KB)</span>
          <input id="maxKb" type="number" min="10" max="1024" value="200" />
        </label>
        <label class="field">
          <span>输出格式</span>
          <select id="format">
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WEBP</option>
          </select>
        </label>
      </div>

      <div class="btn-row">
        <button type="button" class="primary" id="processBtn" disabled>开始处理</button>
        <button type="button" class="secondary" id="downloadBtn" disabled>下载结果</button>
      </div>

      <div class="split-panes">
        <div>
          <p class="field-label">原图预览</p>
          <div class="preview-box"><img id="originPreview" alt="" hidden /></div>
        </div>
        <div>
          <p class="field-label">处理结果</p>
          <div class="preview-box"><img id="resultPreview" alt="" hidden /></div>
        </div>
      </div>

      <p class="status" id="status"></p>
      <p class="note">1M=1024KB</p>
    </section>
  </main>
  <script src="../js/site-config.js"></script>
  <script src="../js/tools-config.js"></script>
  <script src="../js/seo.js"></script>
  <script src="../js/api-config.js"></script>
  <script src="../js/feedback.js"></script>
  <script src="./image.js"></script>
</body>
</html>
