<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文本对比Diff - 在线找差异 | ToolKit</title>
  <meta name="description" content="免费在线文本Diff对比工具，按行高亮两段文本差异，本地处理，适合对比配置、日志、代码片段。" />
  <meta name="keywords" content="文本对比,Diff,在线Diff,文本差异对比,字符串对比" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="文本对比Diff - 在线找差异 | ToolKit" />
  <meta property="og:description" content="免费在线文本Diff对比工具，按行高亮两段文本差异，本地处理，适合对比配置、日志、代码片段。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="canonical" href="__SITE_ORIGIN__/tools/diff.html" />
  <meta property="og:url" content="__SITE_ORIGIN__/tools/diff.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/assets/og-share.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <main class="page">
    <nav class="top-nav"><a href="../index.html">← 返回工具集</a></nav>
    <header class="header">
      <h1>文本Diff</h1>
      <p>按行对比两段文本差异，本地完成</p>
    </header>

    <section class="card">
      <div class="btn-row">
        <button type="button" class="primary" id="btnDiff">开始对比</button>
        <button type="button" class="secondary" id="btnSwap">左右互换</button>
        <button type="button" class="ghost" id="btnClear">清空</button>
      </div>

      <div class="split-panes">
        <label class="field">
          <span>原文（左侧）</span>
          <textarea id="left" placeholder="粘贴原文"></textarea>
        </label>
        <label class="field">
          <span>对比文（右侧）</span>
          <textarea id="right" placeholder="粘贴对比文本"></textarea>
        </label>
      </div>

      <p class="status" id="status"></p>
      <p class="note">绿色：新增　红色：删除　灰色：未变化</p>
      <div class="diff-result" id="diffResult"></div>
    </section>
  </main>
  <script src="../js/site-config.js"></script>
  <script src="../js/tools-config.js"></script>
  <script src="../js/seo.js"></script>
  <script src="../js/api-config.js"></script>
  <script src="../js/feedback.js"></script>
  <script src="./diff.js"></script>
</body>
</html>
