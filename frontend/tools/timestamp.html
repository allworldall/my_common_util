<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间戳转换 - 秒毫秒与日期互转 | ToolKit</title>
  <meta name="description" content="免费在线时间戳转换工具：秒级/毫秒级时间戳与日期时间互转，显示当前时间戳，开发调试常用。" />
  <meta name="keywords" content="时间戳转换,Unix时间戳,毫秒时间戳,日期转时间戳,在线时间戳" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="时间戳转换 - 秒毫秒与日期互转 | ToolKit" />
  <meta property="og:description" content="免费在线时间戳转换工具：秒级/毫秒级时间戳与日期时间互转，显示当前时间戳，开发调试常用。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="canonical" href="__SITE_ORIGIN__/tools/timestamp.html" />
  <meta property="og:url" content="__SITE_ORIGIN__/tools/timestamp.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/assets/og-share.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <main class="page">
    <nav class="top-nav"><a href="../index.html">← 返回工具集</a></nav>
    <header class="header">
      <h1>时间戳转换</h1>
      <p>秒 / 毫秒时间戳与日期互转</p>
    </header>

    <section class="card ts-card">
      <div class="ts-now">
        <span>现在：<strong id="nowTs">-</strong></span>
        <button type="button" class="ghost ts-toggle" id="toggleNow">控制：停止</button>
      </div>

      <div class="ts-row">
        <span class="ts-label">时间戳</span>
        <input id="tsInput" type="text" class="ts-input" placeholder="输入时间戳" />
        <select id="tsUnit" class="ts-unit" aria-label="时间戳单位">
          <option value="s" selected>秒(s)</option>
          <option value="ms">毫秒(ms)</option>
        </select>
        <button type="button" class="primary ts-btn" id="tsToDate">转换</button>
        <input id="dateResult" type="text" class="ts-output" readonly placeholder="转换结果" />
        <span class="ts-suffix">（北京时间）</span>
      </div>

      <div class="ts-row">
        <span class="ts-label">时间</span>
        <input id="dateInput" type="text" class="ts-input" placeholder="yyyy-MM-dd HH:mm:ss" />
        <span class="ts-suffix">（北京时间）</span>
        <button type="button" class="primary ts-btn" id="dateToTs">转换</button>
        <input id="tsResult" type="text" class="ts-output" readonly placeholder="转换结果" />
        <select id="dateUnit" class="ts-unit" aria-label="结果单位">
          <option value="s" selected>秒(s)</option>
          <option value="ms">毫秒(ms)</option>
        </select>
      </div>

      <p class="status" id="status"></p>
    </section>
  </main>
  <script src="../js/site-config.js"></script>
  <script src="../js/tools-config.js"></script>
  <script src="../js/seo.js"></script>
  <script src="../js/api-config.js"></script>
  <script src="../js/feedback.js"></script>
  <script src="./timestamp.js"></script>
</body>
</html>
