<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word转PDF / PDF转Word - 在线互转 | ToolKit</title>
  <meta name="description" content="免费在线 Word 与 PDF 互转：支持 doc/docx 转 PDF、PDF 转 Word，上传后即可下载。转换后请自行核对版式与内容，适合合同、报告格式转换。" />
  <meta name="keywords" content="Word转PDF,PDF转Word,docx转PDF,在线Word转PDF,PDF转docx" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="Word转PDF / PDF转Word - 在线互转 | ToolKit" />
  <meta property="og:description" content="免费在线 Word 与 PDF 互转：支持 doc/docx 转 PDF、PDF 转 Word。转换后请自行核对版式与内容。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="canonical" href="__SITE_ORIGIN__/tools/word-pdf.html" />
  <meta property="og:url" content="__SITE_ORIGIN__/tools/word-pdf.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/assets/og-share.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <main class="page narrow">
    <nav class="top-nav">
      <a href="../index.html">← 返回工具集</a>
    </nav>

    <header class="header">
      <h1>Word ↔ PDF</h1>
      <p>Word 与 PDF 互转，上传后转换并保存到本地</p>
    </header>

    <section class="card">
      <label class="field">
        <span>转换方向</span>
        <select id="direction">
          <option value="word-to-pdf" selected>Word → PDF（.doc / .docx）</option>
          <option value="pdf-to-word">PDF → Word（.docx）</option>
        </select>
      </label>

      <div class="upload-zone" id="uploadZone">
        <input id="fileInput" type="file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
        <p class="upload-title" id="uploadTitle">点击或拖拽 Word 到此处</p>
        <p class="upload-hint" id="fileHint">支持最大 20M</p>
      </div>

      <div class="meta" id="fileMeta" hidden>
        <span id="metaName">-</span>
        <span id="metaSize">大小：-</span>
      </div>

      <p class="convert-notice" id="convertTip"></p>

      <button id="convertBtn" class="primary" type="button" disabled>开始转换</button>
      <p class="status" id="status"></p>
    </section>

    <section class="faq-block" aria-labelledby="word-pdf-faq">
      <h2 id="word-pdf-faq">常见问题</h2>
      <details open>
        <summary>支持哪些格式？</summary>
        <p>Word→PDF 支持 .doc / .docx；PDF→Word 输出为 .docx。复杂版式、扫描件 PDF 保真度可能有限，转换后请自行核对。</p>
      </details>
      <details>
        <summary>中文会乱码吗？</summary>
        <p>服务器已配置常见中文字体。若个别字体缺失，个别字形可能显示异常，可用本机字体另存后再转一次。</p>
      </details>
      <details>
        <summary>转换要多久？</summary>
        <p>一般数十秒内完成；高峰期或大文件可能排队，请耐心等待，不要重复提交。</p>
      </details>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-panel">
      <h2>保存转换结果</h2>
      <p id="modalDesc">文件已生成，请选择保存位置。</p>
      <p class="convert-notice compact" id="modalTip"></p>
      <p class="status" id="modalStatus" hidden></p>
      <div class="modal-actions">
        <button id="saveAsBtn" class="primary" type="button">选择位置保存</button>
        <button id="downloadBtn" class="secondary" type="button">浏览器下载</button>
        <button id="cancelBtn" class="ghost" type="button">取消</button>
      </div>
    </div>
  </div>

  <script src="../js/site-config.js"></script>
  <script src="../js/tools-config.js"></script>
  <script src="../js/seo.js"></script>
  <script src="../js/api-config.js"></script>
  <script src="../js/feedback.js"></script>
  <script src="./word-pdf.js"></script>
</body>
</html>
