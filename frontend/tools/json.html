<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="keywords" content="JSON格式化,JSON校验,JSON压缩,JSON转义,在线JSON,JSON工具" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="在线JSON格式化校验压缩 - 免费JSON工具 | ToolKit" />
  <meta property="og:description" content="免费在线JSON格式化、压缩、校验、转义/去转义，全部在浏览器本地完成，适合接口联调与日志排查。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="canonical" href="__SITE_ORIGIN__/tools/json.html" />
  <meta property="og:url" content="__SITE_ORIGIN__/tools/json.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/assets/og-share.jpg" />

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <main class="page">
    <nav class="top-nav"><a href="../index.html">← 返回工具集</a></nav>
    <header class="header">
      <h1>JSON工具</h1>
      <p>校验、格式化、压缩、转义 / 去转义，全部在本地浏览器处理</p>
    </header>

    <section class="card">
      <div class="btn-row">
        <button type="button" class="primary" id="btnFormat">格式化</button>
        <button type="button" class="secondary" id="btnCompress">压缩</button>
        <button type="button" class="secondary" id="btnValidate">校验</button>
        <button type="button" class="secondary" id="btnEscape">转义</button>
        <button type="button" class="secondary" id="btnUnescape">去转义</button>
        <button type="button" class="secondary" id="btnCopy">复制</button>
        <button type="button" class="ghost" id="btnClear">清空</button>
      </div>

      <div class="split-panes">
        <label class="field">
          <span>输入</span>
          <textarea id="input" placeholder='粘贴 JSON，例如 {"name":"demo"}'></textarea>
        </label>
        <label class="field">
          <span>输出</span>
          <textarea id="output" placeholder="结果会显示在这里" readonly></textarea>
        </label>
      </div>

      <p class="status" id="status"></p>
      <p class="note">提示：转义会把 JSON 变成可嵌入字符串的形式；去转义则反向还原。</p>
    </section>
  </main>
  <script src="../js/site-config.js"></script>
  <script src="../js/tools-config.js"></script>
  <script src="../js/seo.js"></script>
  <script src="../js/api-config.js"></script>
  <script src="../js/feedback.js"></script>
  <script src="./json.js"></script>
</body>
</html>
