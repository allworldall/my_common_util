<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线PDF拆分 - 按页码免费拆分PDF文件 | ToolKit</title>
  <meta name="description" content="免费在线PDF拆分工具：上传PDF，按页码范围拆分并下载，适合截取合同、报告指定页。无需安装软件。" />
  <meta name="keywords" content="PDF拆分,在线PDF拆分,PDF分割,按页拆分PDF,PDF截取页面" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="在线PDF拆分 - 按页码免费拆分PDF文件 | ToolKit" />
  <meta property="og:description" content="免费在线PDF拆分工具：上传PDF，按页码范围拆分并下载，适合截取合同、报告指定页。无需安装软件。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <link rel="canonical" href="__SITE_ORIGIN__/tools/pdf-split.html" />
  <meta property="og:url" content="__SITE_ORIGIN__/tools/pdf-split.html" />
  <meta property="og:image" content="__SITE_ORIGIN__/assets/og-share.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/common.css" />
</head>
<body>
  <main class="page narrow">
    <nav class="top-nav">
      <a href="../index.html">← 返回工具集</a>
    </nav>

    <header class="header">
      <h1>PDF拆分</h1>
      <p>上传 PDF，选择页码范围，拆分后保存到本地</p>
    </header>

    <section class="card">
      <div class="upload-zone" id="uploadZone">
        <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
        <p class="upload-title">点击或拖拽 PDF 到此处</p>
        <p class="upload-hint" id="fileHint">支持最大 50M</p>
      </div>

      <div class="meta" id="fileMeta" hidden>
        <span id="metaName">-</span>
        <span id="metaPages">总页数：-</span>
        <span id="metaSize">大小：-</span>
      </div>

      <div class="range-row">
        <label class="field">
          <span>起始页</span>
          <input id="startPage" type="number" min="1" value="1" />
        </label>
        <label class="field">
          <span>结束页</span>
          <input id="endPage" type="number" min="1" value="1" />
        </label>
      </div>

      <button id="splitBtn" class="primary" type="button" disabled>拆分并下载</button>
      <p class="status" id="status"></p>
    </section>

    <section class="faq-block" aria-labelledby="pdf-split-faq">
      <h2 id="pdf-split-faq">常见问题</h2>
      <details open>
        <summary>如何按页码拆分 PDF？</summary>
        <p>上传 PDF 后填写起始页与结束页，点击「拆分并下载」即可得到该页码范围的新文件，适合截取合同、报告指定页。</p>
      </details>
      <details>
        <summary>文件会上传到服务器吗？</summary>
        <p>拆分在服务端完成处理后立即返回下载，不会做长期存储；请勿上传含高度敏感信息的文件。</p>
      </details>
      <details>
        <summary>支持多大的 PDF？</summary>
        <p>单文件建议不超过 50MB，单次拆分页数也有上限，过大文件可先压缩或分段处理。</p>
      </details>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-panel">
      <h2>保存拆分结果</h2>
      <p id="modalDesc">文件已生成，请选择保存位置。</p>
      <p class="status" id="modalStatus" hidden></p>
      <div class="modal-actions">
        <button id="saveAsBtn" class="primary" type="button">选择位置保存</button>
        <button id="downloadBtn" class="secondary" type="button">浏览器下载</button>
        <button id="cancelBtn" class="ghost" type="button">取消</button>
      </div>
    </div>
  </div>

  <script src="../js/site-config.js"></script>
  <script src="../js/tools-config.js"></script>
  <script src="../js/seo.js"></script>
  <script src="../js/api-config.js"></script>
  <script src="../js/feedback.js"></script>
  <script src="./pdf-split.js"></script>
</body>
</html>
