spring:
  application:
    name: my_common_util
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  # QQ 邮箱 SMTP：密码处填「授权码」（不是 QQ 登录密码）
  # 获取：QQ邮箱网页版 → 设置 → 账户 → POP3/IMAP/SMTP → 开启服务并生成授权码
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 30MB
    max-swallow-size: 30MB

# PDF 拆分防护配置
pdf:
  split:
    max-file-size-bytes: 52428800   # 50MB
    max-page-span: 100             # 单次最多拆分页数
    rate-limit-per-minute: 10      # 同 IP 每分钟请求上限
    api-token: ""                  # 非空时需在请求头带 X-Api-Token

# 意见反馈邮件
feedback:
  enabled: true
  to: 249191841@qq.com             # 接收反馈的邮箱
  rate-limit-per-minute: 5         # 反馈接口单独限流（更严一点）
